name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Node 18 is EOL and eslint 10 needs 20.19+; fail-fast off so one job's failure never
      # cancels the others and hides whether the tests even ran. [DOC-GATE-MEASURES-THE-DIFF]
      # came from the same morning: a matrix that lies is a matrix nobody reads.
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # vitest includes server/src/**/*.test.ts, and the activation server has its own package
      # tree; without this the server test file cannot load on CI (ERR_MODULE_NOT_FOUND, seen the
      # first time the Test step actually ran on 2026-09-07). The server itself is never published.
      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test — CLI help
        run: node dist/cli.js help

      - name: Smoke test — search
        run: node dist/cli.js search "test" || true
