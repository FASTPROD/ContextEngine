# Doc-coverage gate, server side: a change to src/ must come with a doc change in the same
# push or pull request. Agents cannot --no-verify their way past CI.
#
# [LOCKED] [DOC-GATE-MEASURES-THE-DIFF] 2026-09-07
# [NEVER] gate on the wall-clock age of a doc again.
# WHY: the previous version failed any push or PR made more than 8 hours after the last
#      SKILLS.md commit, whatever the change was. On 2026-09-07 two Dependabot bumps that touched
#      only package files failed "Doc Freshness" at 06:16Z because the docs were 21 hours old,
#      and the Telegram alert fired twice for nothing. A timer is not a measurement (the same
#      lesson as [HEALTH-IS-MEASURED-NEVER-ESTIMATED] in src/fleet-health.ts): the question is
#      "did this change touch source without touching docs", and git answers it exactly.
# FIX: diff the range (base..head for a PR, before..after for a push). Source = src/, server/src/,
#      vscode-extension/src/. Docs = SKILLS.md, CHANGELOG.md, README.md, docs/**,
#      .github/copilot-instructions.md, CLAUDE.md. Source changed and no doc changed = fail,
#      with the source files listed. Anything else passes, including a bump that touches nothing.
name: Doc Freshness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check CE doc freshness
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no comparable base for this $EVENT (first push or unknown sha); nothing to measure"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          SRC=$(echo "$CHANGED" | grep -E '^(src|server/src|vscode-extension/src)/' || true)
          DOCS=$(echo "$CHANGED" | grep -E '^(SKILLS\.md|CHANGELOG\.md|README\.md|CLAUDE\.md|docs/|\.github/copilot-instructions\.md)' || true)
          echo "range: ${BASE:0:12}..${HEAD:0:12} ($EVENT)"
          echo "source files changed: $(echo "$SRC" | grep -c . || true)"
          echo "doc files changed:    $(echo "$DOCS" | grep -c . || true)"
          if [ -n "$SRC" ] && [ -z "$DOCS" ]; then
            echo ""
            echo "❌ SOURCE CHANGED WITHOUT A DOC CHANGE:"
            echo "$SRC" | sed 's/^/   - /'
            echo ""
            echo "Add the matching update to SKILLS.md, CHANGELOG.md, docs/ or copilot-instructions.md in the same change."
            exit 1
          fi
          echo "✅ doc coverage holds for this change"
